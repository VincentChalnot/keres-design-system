name: Publish to npm

# Runs when a version tag is pushed (git tag -a v0.4.0 -m v0.4.0 && git push --follow-tags).
# Uses npm Trusted Publishing (OIDC): no NPM_TOKEN. Configure the package on npmjs.com
# (Settings > Trusted Publisher > GitHub Actions: this repository, workflow file publish.yaml).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # OIDC token for npm trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: Trusted publishing needs npm >= 11.5.1
        run: npm install -g npm@latest

      - name: The tag must match package.json
        run: |
          [ "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != package.json version"; exit 1; }

      - run: npm ci

      - name: The style sheet must build
        run: npm run build

      - name: Package contents
        run: npm pack --dry-run

      - run: npm publish --provenance --access public
